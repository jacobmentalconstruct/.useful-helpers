[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidecar-workbench"
version = "0.1.0"
description = "A local directory instrument with governed deterministic capabilities"
requires-python = ">=3.11"

[project.scripts]
sidecar-builder = "factory.cli:main"

[tool.setuptools]
packages = [
  "factory",
  "product",
  "product.bin",
  "product.core",
  "product.tools",
  "product.tools.hash_file",
  "product.tools.inventory",
  "product.tools.read_file",
  "product.tools.search_text",
  "product.tools.write_file",
]

[tool.setuptools.package-data]
"product.tools" = ["*/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
